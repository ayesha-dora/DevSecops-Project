# OWASP ZAP baseline configuration for this repo
# Target service (docker network hostname used by pipeline)
target: "http://devsecops-app:5000"

# Reports (relative paths in repo workspace)
report:
  json: "reports/zap-report.json"
  filtered_json: "reports/zap-report-filtered.json"
  html: "reports/zap-report.html"

# Alert handling:
# - ignore_risks: alerts with these risk levels will be removed from the final report
# - fail_on_minimum: the minimum risk level that should fail the build if present (MEDIUM/HIGH/CRITICAL)
ignore_risks:
  - "Low"
  - "Informational"

# If any remaining alert has this level or higher, treat the scan as a failure
# Valid values used by our wrapper: "Medium", "High", "Critical"
fail_on_minimum: "Medium"

# Runtime scan options (can be used by wrapper to tune zap-baseline.py)
scan:
  spider: true
  ajax_spider: false
  passive_scan_only: false

# Timeout (seconds) for the baseline run
timeout_seconds: 1800
