global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Monitor Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitor Jenkins
  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['jenkins:8080']

  # Monitor Docker containers
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
