global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'devsecops-app'
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['devsecops-app:5000']

  - job_name: 'jenkins'
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['jenkins:8080']
