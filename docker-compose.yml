services:

  # 0. DEVSECOPS-APP — The sample application itself.
  # Added in this engagement: monitoring/prometheus.yml has always scraped a "devsecops-app:5000" target and
  # security/zap-runner.sh has always targeted "http://devsecops-app:5000", but no service by that name was
  # ever defined in this file, so a plain `docker compose up` could stand up the whole tool stack while
  # Prometheus and the ZAP scan both silently had nothing to reach. See docs/GAP_ANALYSIS.md.
  devsecops-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: devsecops-app
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - APP_DB=/tmp/users.db
      - APP_API_KEY=${APP_API_KEY:-}
      - LOG_LEVEL=INFO
    networks:
      - devsecops

  # 1. JENKINS — CI/CD Pipeline Server
  # Builds from ./jenkins/Dockerfile instead of the stock jenkins/jenkins:lts image — see that
  # file for why: the stock image has none of python3/docker CLI/kubectl/helm/bandit/semgrep/
  # checkov/gitleaks/opa that the root Jenkinsfile's stages actually call. First `docker compose
  # up` here will take a few extra minutes to build the image; subsequent starts reuse it.
  jenkins:
    build: ./jenkins
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # k3s's kubeconfig, if k3s is installed on this host (see docs/EC2_DEPLOYMENT_GUIDE.md /
      # scripts/ec2-bootstrap.sh) — read-only, used by the Jenkinsfile's real Deploy stage.
      # Mounting the directory rather than the single k3s.yaml file means this is a harmless
      # empty mount (not an error) on a machine that doesn't have k3s installed at all, e.g. a
      # laptop just running the tool stack without the Kubernetes half of this project.
      - /etc/rancher/k3s:/etc/rancher/k3s:ro
    environment:
      # Belt-and-suspenders alongside ai-agents/mlflow_logger.py's default MLFLOW_HOST=mlflow —
      # this makes the (otherwise Linux-Docker-incompatible) host.docker.internal hostname work
      # too, in case anyone overrides MLFLOW_HOST back to it for a differently-shaped setup.
      - DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME:-}
      - DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN:-}
      # SonarQube Analysis and Dependency Scan stages read these as plain shell env vars
      # (${SONAR_HOST_URL}, ${SONAR_TOKEN} in the Jenkinsfile) — previously undefined here, so
      # both stages silently ran unauthenticated/pointed nowhere even with sonar-scanner installed.
      - SONAR_HOST_URL=${SONAR_HOST_URL:-}
      - SONAR_TOKEN=${SONAR_TOKEN:-}
      - SNYK_TOKEN=${SNYK_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devsecops

  # 2. SONARQUBE — Code Quality Scanner
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - devsecops

  # 3. PROMETHEUS — Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - devsecops

  # 4. GRAFANA — Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # No hardcoded default — set GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD in your .env (see .env.example).
      # A previous version of this file shipped a hardcoded "admin123" password; that is a known-public
      # default and has been removed (see docs/SECURITY.md).
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env, see .env.example}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env, see .env.example}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      # Auto-provisioning (new — see CONTEXT.md Change #12): previously nothing mounted
      # anything into /etc/grafana/provisioning, so a fresh container had zero datasources and
      # the dashboard existed only as a file you had to import by hand. These two mounts make
      # both the "Prometheus"/"Loki" datasources and the "DevSecOps Overview" dashboard appear
      # automatically on container start.
      - ./monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - devsecops

  # 5. MLFLOW — AI Model Tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --default-artifact-root /mlflow/artifacts
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --allowed-hosts "*"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - devsecops

  # 6. OWASP ZAP — Security DAST Scanner
  zap:
    image: zaproxy/zap-stable:latest
    container_name: owasp-zap
    restart: unless-stopped
    ports:
      - "8090:8080"
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.enabled=true
    networks:
      - devsecops

  # 7. LOKI — Log Aggregation
  # NOTE: this service and Promtail below were added in this engagement. Previously monitoring/loki-config.yaml
  # existed and Grafana's dashboard referenced a "Application Security Logs" Loki panel, but no Loki container
  # was actually defined in this file and nothing shipped logs to it — the panel was always empty. See
  # docs/GAP_ANALYSIS.md ("DevOps Problems" / "Loki had no log source").
  loki:
    image: grafana/loki:2.9.6
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - devsecops

  # 8. PROMTAIL — Ships container logs to Loki
  promtail:
    image: grafana/promtail:2.9.6
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - devsecops

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  prometheus_data:
  grafana_data:
  mlflow_data:
  loki_data:

networks:
  devsecops:
    driver: bridge
