services:

  # 0. DEVSECOPS-APP — The sample application itself.
  # Added in this engagement: monitoring/prometheus.yml has always scraped a "devsecops-app:5000" target and
  # security/zap-runner.sh has always targeted "http://devsecops-app:5000", but no service by that name was
  # ever defined in this file, so a plain `docker compose up` could stand up the whole tool stack while
  # Prometheus and the ZAP scan both silently had nothing to reach. See docs/GAP_ANALYSIS.md.
  devsecops-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: devsecops-app
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - APP_DB=/tmp/users.db
      - APP_API_KEY=${APP_API_KEY:-}
      - LOG_LEVEL=INFO
    networks:
      - devsecops

  # 1. JENKINS — CI/CD Pipeline Server
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devsecops

  # 2. SONARQUBE — Code Quality Scanner
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - devsecops

  # 3. PROMETHEUS — Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - devsecops

  # 4. GRAFANA — Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # No hardcoded default — set GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD in your .env (see .env.example).
      # A previous version of this file shipped a hardcoded "admin123" password; that is a known-public
      # default and has been removed (see docs/SECURITY.md).
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env, see .env.example}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env, see .env.example}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devsecops

  # 5. MLFLOW — AI Model Tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --default-artifact-root /mlflow/artifacts
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --allowed-hosts "*"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - devsecops

  # 6. OWASP ZAP — Security DAST Scanner
  zap:
    image: zaproxy/zap-stable:latest
    container_name: owasp-zap
    restart: unless-stopped
    ports:
      - "8090:8080"
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.enabled=true
    networks:
      - devsecops

  # 7. LOKI — Log Aggregation
  # NOTE: this service and Promtail below were added in this engagement. Previously monitoring/loki-config.yaml
  # existed and Grafana's dashboard referenced a "Application Security Logs" Loki panel, but no Loki container
  # was actually defined in this file and nothing shipped logs to it — the panel was always empty. See
  # docs/GAP_ANALYSIS.md ("DevOps Problems" / "Loki had no log source").
  loki:
    image: grafana/loki:2.9.6
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - devsecops

  # 8. PROMTAIL — Ships container logs to Loki
  promtail:
    image: grafana/promtail:2.9.6
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - devsecops

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  prometheus_data:
  grafana_data:
  mlflow_data:
  loki_data:

networks:
  devsecops:
    driver: bridge
