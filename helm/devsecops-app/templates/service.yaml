apiVersion: v1
kind: Service
metadata:
  name: {{ include "devsecops-app.fullname" . | trunc 63 | trimSuffix "-" }}
  labels:
    app: {{ include "devsecops-app.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "devsecops-app.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
